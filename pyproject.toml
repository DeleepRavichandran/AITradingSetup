[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-ai-quant-lab"
version = "0.1.0"
description = "Autonomous AI quantitative research and backtesting platform for NSE (research / paper trading by default)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "duckdb>=1.0",
  "tzdata>=2024.1; sys_platform == 'win32'",   # Windows has no system time-zone database (Asia/Kolkata)
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]
llm = ["anthropic>=0.40"]

[project.scripts]
nseql = "nseql.cli:main"

# The monorepo layout (services/, packages/, agents/) is mapped onto one import
# namespace, `nseql`, so that there is a single dependency graph and no
# cross-service sys.path tricks.
[tool.setuptools]
packages = [
  "nseql", "nseql.instruments", "nseql.indicators", "nseql.contracts",
  "nseql.strategies", "nseql.strategies.library", "nseql.analytics",
  "nseql.data", "nseql.data.adapters", "nseql.backtester", "nseql.research",
  "nseql.risk", "nseql.paper", "nseql.execution", "nseql.execution.brokers",
  "nseql.api", "nseql.agents", "nseql.notify", "nseql.evaluation", "nseql.brain", "nseql.screening",
]

[tool.setuptools.package-dir]
"nseql" = "packages/core"
"nseql.instruments" = "packages/instruments"
"nseql.indicators" = "packages/indicators"
"nseql.contracts" = "packages/contracts"
"nseql.strategies" = "packages/strategies"
"nseql.strategies.library" = "packages/strategies/library"
"nseql.analytics" = "packages/analytics"
"nseql.data" = "services/data"
"nseql.data.adapters" = "services/data/adapters"
"nseql.backtester" = "services/backtester"
"nseql.research" = "services/research"
"nseql.risk" = "services/risk"
"nseql.paper" = "services/paper-trading"
"nseql.execution" = "services/execution"
"nseql.execution.brokers" = "services/execution/brokers"
"nseql.api" = "services/api"
"nseql.agents" = "agents"
"nseql.notify" = "services/notify"
"nseql.evaluation" = "services/evaluation"
"nseql.brain" = "services/brain"
"nseql.screening" = "services/screening"

[tool.setuptools.package-data]
"nseql.instruments" = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests",
  "blocked: requires licensed data or credentials that are not available in CI",
]

[tool.ruff]
line-length = 110
target-version = "py312"
